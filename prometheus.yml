global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    service: leap1a_rcl_inference

scrape_configs:
  # FastAPI inference service. /metrics is exposed by
  # prometheus-fastapi-instrumentator (wired in api_inference.py).
  - job_name: fastapi_inference
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8001    # uvicorn via start_servers.py
        labels:
          app: api_inference
