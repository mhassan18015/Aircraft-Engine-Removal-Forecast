global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    service: leap1a_rcl_inference

scrape_configs:
  # FastAPI inference service. /metrics is exposed by
  # prometheus-fastapi-instrumentator (wired in api_inference.py).
  # Port 8001 in local dev (start_servers.py); port 8000 inside Docker.
  - job_name: fastapi_inference
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8001    # local dev (uvicorn via start_servers.py)
          - localhost:8000    # Docker container
        labels:
          app: api_inference
